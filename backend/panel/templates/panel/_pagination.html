{% if is_paginated %}
<div class="panel-pagination">
    <span>Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
    <span>
        {% if page_obj.has_previous %}<a class="btn" href="?q={{ q|urlencode }}&status={{ status|urlencode }}&page={{ page_obj.previous_page_number }}">Previous</a>{% endif %}
        {% if page_obj.has_next %}<a class="btn" href="?q={{ q|urlencode }}&status={{ status|urlencode }}&page={{ page_obj.next_page_number }}">Next</a>{% endif %}
    </span>
</div>
{% endif %}
