<div class="upload-overlay" id="upload-overlay-{{ kind }}" hidden>
    <div class="upload-box" id="dropzone-{{ kind }}">
        <i class="bi bi-cloud-arrow-up"></i>
        <p>عکس رو بکش و اینجا رها کن، یا</p>
        <label for="file-{{ kind }}" class="btn btn-primary">Browse</label>
        <input type="file" id="file-{{ kind }}" accept="image/*" hidden>
        <img class="preview" hidden>
    </div>
    <div class="upload-actions">
        <button type="button" class="btn" data-close>انصراف</button>
        <button type="button" class="btn btn-primary" data-save>ذخیره</button>
    </div>
</div>
